<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Vector Relay — treatment boards</title><style>body{margin:0;background:#101211;color:#f3f5ee;font:16px Arial;padding:4vw}h1{font-size:48px;letter-spacing:-.05em}p{color:#aab8ad;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}article{border:1px solid #39413b}article h2,article p{margin:20px}canvas{display:block;width:100%;aspect-ratio:1.75}h2{font-size:23px}article p{font-size:12px}a{color:#b6f4d4}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style><p>DELVE TOGETHER / VECTOR RELAY / CONCEPT CALIBRATION</p><h1>One identity. Three treatments.</h1><p>Preserve the forked pilot, circular rescue marker, and functional threat shapes. Vary the environment, value structure, type, and motion grammar.</p><div class="grid" id="boards"></div><script type="module">import{treatments,renderBoard}from'./studies.js';const boards=[];for(const[key,t]of Object.entries(treatments)){const a=document.createElement('article');a.innerHTML=`<h2>${t.name}</h2><canvas role="img" aria-label="${t.name} concept board"></canvas><p>${t.grammar}</p><p>${t.motion}</p>`;document.querySelector('#boards').append(a);boards.push([a.querySelector('canvas'),key]);}function draw(){for(const[c,k]of boards)renderBoard(c,k);}new ResizeObserver(draw).observe(document.body);draw();</script></html>
