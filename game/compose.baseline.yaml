name: delve-together-baseline
services:
  backend:
    image: delve-together-backend:baseline-0.1
    environment:
      PORT: 8080
      DEV_TOOLS: 1
    init: true
    restart: unless-stopped
  web:
    image: delve-together-web:baseline-0.1
    ports:
      - "127.0.0.1:5174:8080"
    depends_on:
      - backend
    restart: unless-stopped
